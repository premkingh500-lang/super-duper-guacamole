name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
      - run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/MagicMobile.apk
          unzip -j app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libmagicmobile.so -d out
      - uses: actions/upload-artifact@v4
        with: { name: MagicMobile, path: out }
