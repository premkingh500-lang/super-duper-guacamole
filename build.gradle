plugins { id 'com.android.application' }
android {
    namespace 'com.promo.magicmobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.promo.magicmobile'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -fvisibility=hidden' } }
    }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.bytedance.android:shadowhook:1.0.9' }
